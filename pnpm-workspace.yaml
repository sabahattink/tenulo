# Packages allowed to run install scripts. pnpm fails the install (strictDepBuilds) on any
# unreviewed build script, so every new entry here is a deliberate decision.
allowBuilds:
  # Native binary check for the bundler used by drizzle-kit and vitest. Dev-only, never shipped.
  esbuild: true

# React Native's native (CMake/ninja) builds break on Windows when packages are reached through
# pnpm's isolated-store junctions: prefab paths resolve relative to the real path and ninja loops
# with "build.ninja still dirty". A flat, npm-style node_modules avoids the junctions.
nodeLinker: hoisted
